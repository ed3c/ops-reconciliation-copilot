name: Runtime evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/verify_runtime.py
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_browser.py
      - run: python scripts/verify_mapping.py
      - name: Record installed dependencies
        if: always()
        run: |
          mkdir -p evidence
          python -m pip freeze > evidence/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14
