name: Runtime evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Offline research request validation (no model calls)
        run: python scripts/research.py
      - run: python scripts/verify_runtime.py
      - run: python scripts/verify_owner.py
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_browser.py
      - run: python scripts/verify_mapping.py
      - name: Record installed dependencies
        if: always()
        run: |
          mkdir -p evidence
          python -m pip freeze > evidence/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recon
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: recon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recon -d recon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://recon:ci-only-password@127.0.0.1:5432/recon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/init_db.py
      - run: python scripts/init_db.py
      - run: python scripts/verify_db_access.py
      - run: python scripts/verify_runtime.py
      - run: python scripts/verify_owner.py
      - run: python scripts/verify_postgres.py
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_browser.py
      - run: python scripts/verify_mapping.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14
